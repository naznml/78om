<title>M078 Құқық | Өміржанов</title>

<style>
:root{
  --bg:#f5f6fa;
  --card:#ffffff;
  --text:#181b22;
  --muted:#747b88;
  --line:#e4e7ee;
  --accent:#3154d8;
  --accent-soft:#eef1ff;
  --green:#11845d;
  --green-bg:#e9f8f2;
  --red:#c93f58;
  --red-bg:#fff0f3;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  line-height:1.5;
}

.container{
  width:min(900px,100%);
  margin:auto;
  padding:18px 12px 70px;
}

.top{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
}

.label{
  font-size:13px;
  color:var(--accent);
  font-weight:800;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:25px;
  line-height:1.25;
}

.subtitle{
  color:var(--muted);
  margin-top:8px;
  font-size:14px;
}

.book{
  margin-top:14px;
  padding:10px 12px;
  border-radius:12px;
  background:#f5f6fa;
  font-size:13px;
  color:#555d6c;
}

.section-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
}

.section-head{
  padding:20px;
  border-bottom:1px solid var(--line);
}

.section-number{
  color:var(--accent);
  font-size:13px;
  font-weight:800;
}

.section-title{
  margin:5px 0 0;
  font-size:21px;
  font-weight:800;
}

.section-info{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}

.progress-wrap{
  margin-top:15px;
}

.progress-text{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:700;
  color:#555d6c;
  margin-bottom:6px;
}

.progress{
  height:8px;
  background:#edf0f4;
  border-radius:99px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  background:var(--accent);
  transition:.25s;
}

.questions{
  padding:4px 14px 18px;
}

.question{
  padding:18px 4px;
  border-bottom:1px solid var(--line);
}

.question:last-child{
  border-bottom:none;
}

.q-number{
  font-size:12px;
  font-weight:800;
  color:var(--accent);
  margin-bottom:6px;
}

.q-text{
  font-size:16px;
  font-weight:750;
  margin-bottom:13px;
}

.options{
  display:grid;
  gap:8px;
}

.option{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  cursor:pointer;
  transition:.15s;
}

.option:hover{
  border-color:#aebaf0;
  background:#fafbff;
}

.option input{
  margin-top:3px;
  accent-color:var(--accent);
}

.option.correct{
  border-color:#84d2b4;
  background:var(--green-bg);
  color:#086343;
}

.option.wrong{
  border-color:#efabb8;
  background:var(--red-bg);
  color:#91253a;
}

.explanation{
  display:none;
  margin-top:13px;
  padding:13px;
  background:#f7f8fb;
  border-radius:13px;
  border:1px solid var(--line);
  font-size:14px;
}

.explanation.show{
  display:block;
}

.correct-answer{
  color:var(--green);
  font-weight:800;
  margin-bottom:8px;
}

.explanation-text{
  margin-bottom:10px;
}

.source{
  color:#5f6674;
  font-size:12px;
  background:#eceef3;
  border-radius:8px;
  padding:7px 9px;
  display:inline-block;
}

.section-actions{
  padding:16px;
  border-top:1px solid var(--line);
  background:#fafbfc;
}

.show-result{
  width:100%;
  border:0;
  background:var(--accent);
  color:#fff;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.show-result:active{
  transform:scale(.99);
}

.result-box{
  display:none;
  margin-top:13px;
  background:#fff;
  border:1px solid var(--line);
  padding:16px;
  border-radius:15px;
}

.result-box.show{
  display:block;
}

.result-score{
  font-size:27px;
  font-weight:900;
  color:var(--accent);
}

.result-percent{
  margin-top:3px;
  color:#555d6c;
}

.reset-btn{
  margin-top:10px;
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:11px;
  font-weight:700;
  cursor:pointer;
}

@media(max-width:600px){
  .container{
    padding:10px 8px 60px;
  }

  .top,
  .section-card{
    border-radius:17px;
  }

  h1{
    font-size:21px;
  }

  .section-title{
    font-size:18px;
  }

  .section-head{
    padding:16px;
  }

  .questions{
    padding-left:12px;
    padding-right:12px;
  }

  .q-text{
    font-size:15px;
  }

  .option{
    padding:10px;
    font-size:14px;
  }
}
</style>
</head>

/* =========================================================
   БӨЛІМДЕР
   Кейін 2, 3, 4-бөлімдерді осы объектіге қосамыз
   ========================================================= */

const sections = {

1:{
  questions:section1Questions,
  answers:Array(section1Questions.length).fill(null),
  finished:false
}

};


/* =========================================================
   СҰРАҚТАРДЫ ШЫҒАРУ
   ========================================================= */

function renderSection(sectionId){

  const section = sections[sectionId];

  const container =
    document.getElementById("questions" + sectionId);

  container.innerHTML = "";

  section.questions.forEach((item,index)=>{

    const question =
      document.createElement("div");

    question.className="question";

    let optionsHTML="";

    item.options.forEach((option,optionIndex)=>{

      optionsHTML += `
        <label class="option"
               id="s${sectionId}q${index}o${optionIndex}">

          <input
            type="radio"
            name="s${sectionId}q${index}"
            value="${optionIndex}"
            ${section.answers[index] === optionIndex ? "checked" : ""}
            ${section.finished ? "disabled" : ""}
          >

          <span>${option}</span>

        </label>
      `;

    });

    question.innerHTML=`

      <div class="q-number">
        ${index+1}-сұрақ
      </div>

      <div class="q-text">
        ${item.q}
      </div>

      <div class="options">
        ${optionsHTML}
      </div>

      <div class="explanation"
           id="explanation-s${sectionId}-q${index}">

        <div class="correct-answer">
          Дұрыс жауап:
          ${item.options[item.answer]}
        </div>

        <div class="explanation-text">
          <b>Түсіндірме:</b>
          ${item.explanation}
        </div>

        <div class="source">
          Дереккөз:
          Е. Өміржанов,
          «Мемлекет және құқық теориясы»,
          2015,
          ${item.page}-бет.
        </div>

      </div>

    `;

    container.appendChild(question);

  });


  if(!section.finished){

    container
      .querySelectorAll("input[type=radio]")
      .forEach(input=>{

        input.addEventListener("change",function(){

          const name=this.name;

          const qIndex=
            Number(name.split("q")[1]);

          section.answers[qIndex]=
            Number(this.value);

          saveProgress();

          updateProgress(sectionId);

        });

      });

  }

  updateProgress(sectionId);

}


/* =========================================================
   ПРОГРЕСС
   ========================================================= */

function updateProgress(sectionId){

  const section=sections[sectionId];

  const answered=
    section.answers.filter(
      answer=>answer!==null
    ).length;

  document.getElementById(
    "progressText"+sectionId
  ).textContent =
    answered+" / "+section.questions.length;

  document.getElementById(
    "progressFill"+sectionId
  ).style.width =
    (
      answered /

    )+"%";

}


/* =========================================================
   НӘТИЖЕНІ КӨРСЕТУ
   ========================================================= */

function showSectionResult(sectionId){

  const section=sections[sectionId];

  let correct=0;

  section.finished=true;

  section.questions.forEach((item,index)=>{

    const selected=
      section.answers[index];

    if(selected===item.answer){
      correct++;
    }

  });

  renderSection(sectionId);


  section.questions.forEach((item,index)=>{

    const correctOption=
      document.getElementById(
        `s${sectionId}q${index}o${item.answer}`
      );

    correctOption.classList.add("correct");


    const selected=
      section.answers[index];

    if(
      selected!==null &&
      selected!==item.answer
    ){

      document.getElementById(
        `s${sectionId}q${index}o${selected}`
      ).classList.add("wrong");

    }


    document.getElementById(
      `explanation-s${sectionId}-q${index}`
    ).classList.add("show");

  });


  const percent=
    Math.round(
      correct /
      section.questions.length *
      100
    );


  document.getElementById(
    "score"+sectionId
  ).textContent=
    correct+" / "+section.questions.length;


  document.getElementById(
    "percent"+sectionId
  ).textContent=
    "Нәтиже: "+percent+"%";


  document.getElementById(
    "result"+sectionId
  ).classList.add("show");


  saveProgress();


  document.getElementById(
    "result"+sectionId
  ).scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =========================================================
   ҚАЙТА ТАПСЫРУ
   ========================================================= */

function resetSection(sectionId){

  const section=sections[sectionId];

  section.answers=
    Array(
      section.questions.length
    ).fill(null);

  section.finished=false;

  document.getElementById(
    "result"+sectionId
  ).classList.remove("show");

  saveProgress();

  renderSection(sectionId);

  document.getElementById(
    "section"+sectionId
  ).scrollIntoView({
    behavior:"smooth"
  });

}


/* =========================================================
   ПРОГРЕСТІ САҚТАУ
   ========================================================= */

function saveProgress(){

  const saveData={};

  Object.keys(sections).forEach(id=>{

    saveData[id]={
      answers:sections[id].answers,
      finished:sections[id].finished
    };

  });

  localStorage.setItem(
    "M078_Omirzhanov",
    JSON.stringify(saveData)
  );

}


/* =========================================================
   ПРОГРЕСТІ ЖҮКТЕУ
   ========================================================= */

function loadProgress(){

  const saved=
    localStorage.getItem(
      "M078_Omirzhanov"
    );

  if(!saved) return;

  try{

    const data=
      JSON.parse(saved);

    Object.keys(data).forEach(id=>{

      if(
        sections[id] &&
        Array.isArray(data[id].answers) &&
        data[id].answers.length ===
        sections[id].questions.length
      ){

        sections[id].answers=
          data[id].answers;

        sections[id].finished=
          data[id].finished || false;

      }

    });

  }catch(e){}

}

          correct++;

        document.getElementById(
          `s3q${index}o${item.answer}`

          "correct"

          selected !== item.answer

          `explanation-s3-q${index}`

          "show"

    section.questions.forEach(
      (item,index)=>{

        if(
          section.answers[index] ===
          item.answer
        ){
          correct++;
        }


        document.getElementById(
          `s4q${index}o${item.answer}`
        ).classList.add(
          "correct"
        );


        const selected =
          section.answers[index];


        if(
          selected !== null &&
          selected !== item.answer
        ){

          document.getElementById(
            `s4q${index}o${selected}`
          ).classList.add(
            "wrong"
          );

        }


        document.getElementById(
          `explanation-s4-q${index}`
        ).classList.add(
          "show"
        );

      }
    );


    const percent =
      Math.round(
        correct /
        section.questions.length *
        100
      );


    document.getElementById(
      "score4"
    ).textContent =
      correct +
      " / " +
      section.questions.length;


    document.getElementById(
      "percent4"
    ).textContent =
      "Нәтиже: " +
      percent +
      "%";


    document.getElementById(
      "result4"
    ).classList.add(
      "show"
    );

  },0);

}

try{

  const savedData =
    JSON.parse(
      localStorage.getItem(
        "M078_Omirzhanov"
      )
    );

  if(
    savedData &&
    savedData[5] &&
    Array.isArray(
      savedData[5].answers
    ) &&
    savedData[5].answers.length ===
    section5Questions.length
  ){

    sections[5].answers =
      savedData[5].answers;

    sections[5].finished =
      savedData[5].finished || false;

  }

}catch(e){}

   ========================================================= */

if(sections[5].finished){

  setTimeout(()=>{

    const section =
      sections[5];

    let correct = 0;


    section.questions.forEach(
      (item,index)=>{

        if(
          section.answers[index] ===
          item.answer
        ){
          correct++;
        }


        document.getElementById(
          `s5q${index}o${item.answer}`
        ).classList.add(
          "correct"
        );


        const selected =
          section.answers[index];


        if(
          selected !== null &&
          selected !== item.answer
        ){

          document.getElementById(
            `s5q${index}o${selected}`
          ).classList.add(
            "wrong"
          );

        }


        document.getElementById(
          `explanation-s5-q${index}`
        ).classList.add(
          "show"
        );

      }
    );


    const percent =
      Math.round(
        correct /
        section.questions.length *
        100
      );


    document.getElementById(
      "score5"
    ).textContent =
      correct +
      " / " +
      section.questions.length;


    document.getElementById(
      "percent5"
    ).textContent =
      "Нәтиже: " +
      percent +
      "%";


    document.getElementById(
      "result5"
    ).classList.add(
      "show"
    );

  },0);

}

/* =========================================================
   6-БӨЛІМНІҢ САҚТАЛҒАН ПРОГРЕСІ
   ========================================================= */

try{

  const savedData =
    JSON.parse(
      localStorage.getItem(
        "M078_Omirzhanov"
      )
    );

  if(
    savedData &&
    savedData[6] &&
    Array.isArray(
      savedData[6].answers
    ) &&
    savedData[6].answers.length ===
    section6Questions.length
  ){

    sections[6].answers =
      savedData[6].answers;

    sections[6].finished =
      savedData[6].finished || false;

  }

}catch(e){}


/* =========================================================
   6-БӨЛІМДІ ШЫҒАРУ
   ========================================================= */

renderSection(6);


/* =========================================================
   БҰРЫН АЯҚТАЛҒАН БОЛСА НӘТИЖЕСІН ҚАЙТА ШЫҒАРУ
   ========================================================= */

if(sections[6].finished){

  setTimeout(()=>{

    const section =
      sections[6];

    let correct = 0;


    section.questions.forEach(
      (item,index)=>{

        if(
          section.answers[index] ===
          item.answer
        ){
          correct++;
        }


        document.getElementById(
          `s6q${index}o${item.answer}`
        ).classList.add(
          "correct"
        );


        const selected =
          section.answers[index];


        if(
          selected !== null &&
          selected !== item.answer
        ){

          document.getElementById(
            `s6q${index}o${selected}`
          ).classList.add(
            "wrong"
          );

        }


        document.getElementById(
          `explanation-s6-q${index}`
        ).classList.add(
          "show"
        );

      }
    );


    const percent =
      Math.round(
        correct /
        section.questions.length *
        100
      );


    document.getElementById(
      "score6"
    ).textContent =
      correct +
      " / " +
      section.questions.length;


    document.getElementById(
      "percent6"
    ).textContent =
      "Нәтиже: " +
      percent +
      "%";


    document.getElementById(
      "result6"
    ).classList.add(
      "show"
    );

  },0);

}
